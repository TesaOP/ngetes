# Workspace Rust untuk Lumimi. Produk = SATU exe SATU proses (Lumimi.exe):
# shell Tauri meng-host core Rust in-process. Lihat docs/ARCHITECTURE-TAURI-RUST.md.
#
# Anggota:
#   agent-shell  — cangkang Tauri (jendela app + pet) yang meng-host core in-process.
#   engine       — LIBRARY inferensi native (TTS SuperTonic + STT Whisper); tanpa bin.
#   core         — backend penuh (axum HTTP loopback + IPC per-domain), dipakai
#                  in-process oleh shell dan sebagai server standalone (dev/CLI/OBS).
[workspace]
members = ["agent-shell", "engine", "core"]
resolver = "2"

# Profil didefinisikan di root (Cargo mengabaikan [profile.*] di crate member
# dalam workspace). Default kecil (untuk shell); engine di-override ke opt-level
# 3 karena kecepatan inferensi > ukuran. Catatan: `lto` & `panic` hanya bisa
# di level profil (bukan per-package), jadi dipilih yang aman untuk FFI berat
# (ort/whisper.cpp): unwind default + lto tipis.
[profile.release]
opt-level = "s"
# 2026-09-22: lto + codegen-units=1 dimatikan — linker OOM (STATUS_STACK_BUFFER_
# OVERRUN) di mesin 8GB (600MB bebas) saat menggabung companion (tauri+wry+
# axum+ort+frontend ter-embed). Binary lebih besar, tapi nge-build di mana
# saja. Mesin kuat boleh override via env:
# CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
lto = false
codegen-units = 16
strip = true

[profile.release.package.live2d-engine]
opt-level = 3
