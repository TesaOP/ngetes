# live2d-core — Rust application core (Tauri) untuk Live2D Agent.
#
# Menyajikan backend HTTP IN-PROCESS (axum, loopback) di dalam Tauri — inilah
# jalur menuju SATU executable (Companion.exe): tidak ada proses Bun terpisah.
# Rute Bun (src/server/index.ts) diport ke handler axum di sini bertahap.
# Lihat docs/ARCHITECTURE-TAURI-RUST.md §2 (revisi single-exe) + roadmap.
[package]
name = "live2d-core"
version = "0.1.0"
description = "Application core (Rust) untuk Live2D Agent — server HTTP in-process di Tauri"
edition = "2021"
rust-version = "1.77"

[lib]
name = "live2d_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs"] }
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
