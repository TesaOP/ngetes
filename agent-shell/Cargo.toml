[package]
name = "live2d-shell"
version = "0.1.0"
description = "Cangkang jendela (pet transparan + app utama) untuk Live2D Agent — WebView2, tanpa Electron"
edition = "2021"
rust-version = "1.77"

# Binary statis kecil; WebView2 diambil dari runtime bawaan Windows.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Profil release dipindah ke workspace root (Cargo mengabaikan profil member
# di dalam workspace). Ukuran exe shell tetap dijaga kecil di root.
