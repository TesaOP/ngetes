<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>Arbiter — Fase 13 proof</title>
<style>html,body{margin:0;background:#e8e8e8}canvas{display:block}</style>
<script src="js/live2dcubismcore.min.js"></script>
<script type="importmap">{"imports":{"pixi.js":"./js/pixi8.mjs"}}</script>
<script type="module">
import * as PIXI from 'pixi.js';
import { Live2DRenderer, ParameterArbiter } from './js/live2d-render.mjs';

const app = new PIXI.Application();
await app.init({ width: 420, height: 640, background: '#e8e8e8' });
document.body.appendChild(app.canvas);
const gl = app.canvas.getContext('webgl2') || app.canvas.getContext('webgl');
const renderer = new Live2DRenderer(app.canvas, gl);
await renderer.loadModel('/model/ren_official_cubism/runtime/ren.model3.json');

// test arbiter standalone
const arb = new ParameterArbiter();
arb.set('ParamEyeLOpen', 0.2, 'motion');
arb.set('ParamEyeLOpen', 1.0, 'blink');
console.log('[fase13] conflict ParamEyeLOpen', arb.hasConflict('ParamEyeLOpen'), 'resolved', arb.resolve().get('ParamEyeLOpen')); // harus 1.0 (blink prio 90 > 60)
arb.set('ParamAngleX', 10, 'motion');
arb.set('ParamAngleX', -5, 'manual');
console.log('[fase13] conflict ParamAngleX', arb.hasConflict('ParamAngleX'), 'resolved', arb.resolve().get('ParamAngleX')); // manual 100 > motion 60 → -5

// via renderer: set same param dari dua sumber
renderer.setParameter('ParamAngleX', 20, 'motion');
renderer.setParameter('ParamAngleX', -10, 'blink');
console.log('[fase13] renderer hasConflict', renderer.hasConflict('ParamAngleX'), 'get', renderer.getParameter('ParamAngleX'));
let f=0;
function frame(){
  renderer.draw();
  f++;
  if(f===2){
    console.log('[fase13] after draw param', renderer.getParameter('ParamAngleX'));
    window.__fase13 = { ok:true, arbBlink: arb.resolve().get('ParamEyeLOpen'), arbManual: arb.resolve().get('ParamAngleX'), rendererParam: renderer.getParameter('ParamAngleX'), conflict: renderer.hasConflict('ParamAngleX') };
  }
  if(f<5) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
