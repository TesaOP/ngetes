<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>Role mapping — Fase 10 proof</title>
<style>html,body{margin:0;background:#e8e8e8}canvas{display:block}</style>
<script src="js/live2dcubismcore.min.js"></script>
<script type="importmap">{"imports":{"pixi.js":"./js/pixi8.mjs"}}</script>
<script type="module">
import * as PIXI from 'pixi.js';
import { Live2DRenderer, mapRoles } from './js/live2d-render.mjs';

const app = new PIXI.Application();
await app.init({ width: 420, height: 640, background: '#e8e8e8' });
document.body.appendChild(app.canvas);
const gl = app.canvas.getContext('webgl2') || app.canvas.getContext('webgl');
const renderer = new Live2DRenderer(app.canvas, gl);
await renderer.loadModel('/model/ren_official_cubism/runtime/ren.model3.json');
const mapRen = renderer.getRoleMap();
console.log('[fase10] ren role map', mapRen);
console.log('[fase10] ren angleX id', mapRen?.angleX, 'eyeLOpen', mapRen?.eyeLOpen, 'mouthOpenY', mapRen?.mouthOpenY);
// second model synthetic: IDs berbeda tapi role sama (model-agnostic)
const syntheticParams = new Set(['HeadYaw', 'HeadPitch', 'HeadRoll', 'EyeLOpen', 'EyeROpen', 'MouthOpenY', 'BodyYaw']);
let syntheticMap = null;
try {
  syntheticMap = mapRoles(syntheticParams);
  console.log('[fase10] synthetic params', Array.from(syntheticParams));
} catch(e){ console.log('[fase10] synthetic err', e.message); }
console.log('[fase10] synthetic map', syntheticMap);

// test role set
const ok = renderer.setRole('angleX', 15);
console.log('[fase10] setRole angleX 15', ok, 'getRole', renderer.getRole('angleX'), 'get ParamAngleX', renderer.getParameter('ParamAngleX'));
window.__fase10 = { ren: mapRen, synthetic: syntheticMap, setOk: ok, angleX: renderer.getRole('angleX') };
let f=0; function frame(){ renderer.draw(); if(++f<3) requestAnimationFrame(frame);} requestAnimationFrame(frame);
</script>
</html>
