<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>Live2D Pixi8 — Fase 6 render proof</title>
<style>html,body{margin:0;background:#e8e8e8}canvas{display:block;border:1px solid #ccc}</style>
<script src="js/live2dcubismcore.min.js"></script>
<script type="importmap">{"imports":{"pixi.js":"./js/pixi8.mjs"}}</script>
<script type="module">
import * as PIXI from 'pixi.js';
import { Live2DRenderer } from './js/live2d-render.mjs';

const app = new PIXI.Application();
await app.init({ width: 420, height: 640, background: '#e8e8e8', backgroundAlpha: 1, antialias: true });
document.body.appendChild(app.canvas);
const gl = app.canvas.getContext('webgl2') || app.canvas.getContext('webgl');
console.log('[fase6] PIXI', PIXI.VERSION, 'core', window.Live2DCubismCore?.Version?.csmGetVersion?.().toString(16), 'gl', gl?.getParameter?.(gl.VERSION) || 'no-gl');

const renderer = new Live2DRenderer(app.canvas, gl);
const PATH = '/model/ren_official_cubism/runtime/ren.model3.json';
let info;
try {
  info = await renderer.loadModel(PATH);
  console.log('[fase6] load OK', JSON.stringify(info));
} catch (e) {
  console.error('[fase6] load FAIL', e?.message || e);
  window.__fase6 = { ok: false, error: String(e?.message || e) };
  throw e;
}

// rAF loop — Pixi render dulu, lalu Cubism draw ke canvas sama
let frames = 0;
function frame() {
  // Pixi tidak render stage (Fase 6 proof fokus Cubism) — biar tidak bentrok state GL
  renderer.draw();
  frames++;
  if (frames === 1) {
    const px = new Uint8Array(4);
    gl.readPixels((gl.drawingBufferWidth>>1), (gl.drawingBufferHeight>>1), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    console.log('[fase6] pixel tengah frame1 rgba', px.join(','));
    window.__fase6 = { ok: true, info, pixi: PIXI.VERSION, pixel1: Array.from(px), hasCanvas: !!app.canvas };
  }
  if (frames === 30) {
    const px = new Uint8Array(4);
    gl.readPixels((gl.drawingBufferWidth>>1), (gl.drawingBufferHeight>>1), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    console.log('[fase6] pixel tengah frame30 rgba', px.join(','));
    // grid 5x5 untuk bukti distribusi
    const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
    const rows=[];
    for(let ry=4; ry>=0; ry--){ let row=''; for(let rx=0; rx<5; rx++){ const p=new Uint8Array(4); gl.readPixels(((rx+0.5)*W/5|0), ((ry+0.5)*H/5|0), 1,1, gl.RGBA, gl.UNSIGNED_BYTE, p); const isBg = p[0]==232&&p[1]==232&&p[2]==232; row+= isBg?'.':'#'; } rows.push(row); }
    console.log('[fase6] grid5x5\n'+rows.join('\n'));
    window.__fase6.grid = rows.join('\n');
    window.__fase6.pixel30 = Array.from(px);
    try { window.__fase6.dataUrlFrame30 = app.canvas.toDataURL('image/png').slice(0,120); } catch {}
  }
  if (frames < 35) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
